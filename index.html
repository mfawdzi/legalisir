<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pembuat Stempel Legalisir</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1d2a;--mut:#667;--bd:#d8dbe8;--ac:#2a2ad0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14151c;--card:#1e2030;--tx:#eceefa;--mut:#9aa;--bd:#383c55;--ac:#7c8cff}}
:root[data-theme="dark"]{--bg:#14151c;--card:#1e2030;--tx:#eceefa;--mut:#9aa;--bd:#383c55;--ac:#7c8cff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
.w{max-width:760px;margin:0 auto;display:grid;gap:14px}
h1{font-size:20px;margin:0}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input[type=text]{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:15px}
.r{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}
.r label{margin:0;display:flex;align-items:center;gap:6px;font-size:14px;color:var(--tx)}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:600}
.pv{text-align:center;background:repeating-conic-gradient(#e6e6e6 0 25%,#fff 0 50%) 0 0/16px 16px;border-radius:10px;padding:10px}
.pv img{max-width:100%;height:auto;display:block;margin:0 auto}
p{font-size:13px;color:var(--mut);margin:8px 0 0}
</style>
</head>
<body>
<div class="w">
<h1>Pembuat Stempel Legalisir</h1>
<div class="c">
<label>Judul</label><input type="text" id="t1" value="MENGETAHUI / MENGESAHKAN">
<label>Keterangan</label><input type="text" id="t2" value="SALINAN PHOTO COPY SESUAI DENGAN ASLINYA">
<label>Kota / tanggal</label><input type="text" id="t3" value="Duri, ........................ 20 ....">
<label>Jabatan</label><input type="text" id="t4" value="KEPALA">
<label>Nama lembaga / instansi</label><input type="text" id="t5" value="Nama /lembaga/instansi/dll">
<label>Nama dan gelar</label><input type="text" id="t6" value="NAMA DAN GELAR">
<label>NIP / lainnya</label><input type="text" id="t7" value="NIP. /DLL">
<div class="r">
<label>Warna <input type="color" id="col" value="#2a2ad0"></label>
<label><input type="checkbox" id="tr" checked> Latar transparan</label>
</div>
</div>
<div class="c">
<div class="pv"><img id="out" alt="Hasil stempel"></div>
<div class="r"><button id="dl">Unduh PNG</button></div>
<p>Jika tombol unduh tidak berfungsi, tekan lama pada gambar lalu pilih simpan.</p>
</div>
</div>
<canvas id="cv" width="900" height="620" style="display:none"></canvas>
<script>
var cv=document.getElementById('cv'),cx=cv.getContext('2d'),out=document.getElementById('out');
var F='"Arial Narrow","Liberation Sans Narrow",Arial,Helvetica,sans-serif';
function fit(txt,y,size,maxW,ul){
  var s=size;
  cx.font='bold '+s+'px '+F;
  while(cx.measureText(txt).width>maxW&&s>10){s-=1;cx.font='bold '+s+'px '+F;}
  cx.fillText(txt,450,y);
  if(ul){var w=cx.measureText(txt).width;cx.fillRect(450-w/2-12,y+8,w+24,4);}
}
function draw(){
  var col=document.getElementById('col').value;
  cx.clearRect(0,0,900,620);
  if(!document.getElementById('tr').checked){cx.fillStyle='#fff';cx.fillRect(0,0,900,620);}
  cx.strokeStyle=col;cx.lineWidth=6;cx.strokeRect(20,20,860,580);
  cx.fillStyle=col;cx.textAlign='center';cx.textBaseline='alphabetic';
  var v=function(i){return document.getElementById('t'+i).value;};
  fit(v(1),100,70,820);
  fit(v(2),155,36,820);
  fit(v(3),230,38,800);
  fit(v(4),300,40,800);
  fit(v(5),350,36,800);
  fit(v(6),500,56,780,true);
  fit(v(7),570,48,780);
  out.src=cv.toDataURL('image/png');
}
document.querySelectorAll('input').forEach(function(e){e.addEventListener('input',draw);});
document.getElementById('dl').onclick=function(){
  try{var a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download='stempel-legalisir.png';document.body.appendChild(a);a.click();a.remove();}catch(e){}
};
draw();
</script>
</body>
</html>
